version: "3.8"

services:
  op-sec-proxy:
    build: .
    container_name: op-sec-proxy
    restart: unless-stopped
    ports:
      - "8545:3000"
    environment:
      - OP_RPC_URL=https://mainnet.optimism.io
      - PROXY_PORT=3000
      - CHAIN_ID=10
    healthcheck:
      test: ["CMD", "curl", "-f", "-X", "POST", "-H", "Content-Type: application/json", "-d", "{\"jsonrpc\":\"2.0\",\"method\":\"eth_blockNumber\",\"params\":[],\"id\":1}", "http://localhost:3000"]
      interval: 15s
      timeout: 3s
      retries: 3
